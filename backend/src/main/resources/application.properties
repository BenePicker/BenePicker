spring.application.name=backend

# DB config
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# MyBatis
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.type-aliases-package=com.benepicker.member.dto
mybatis.configuration.map-underscore-to-camel-case=true

# JWT token
jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:1209600000}

# 포트 설정 (React dev server: 5173 / Spring: 8080)
server.port=8080

# Spring DevTools
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

# 로그 레벨
logging.level.com.benepicker=debug

# 세션 추적 (JWT 사용이지만 기본값 설정)
server.servlet.session.tracking-modes=cookie

# 파일 업로드 크기 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs